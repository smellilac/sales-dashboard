services:
  postgres:
    image: postgres:17
    environment:
      # Password is inline: this compose file is for LOCAL runs only. Do not reuse in production.
      POSTGRES_USER: sales
      POSTGRES_PASSWORD: sales
      POSTGRES_DB: sales
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sales -d sales"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__Sales: "Host=postgres;Port=5432;Database=sales;Username=sales;Password=sales"
      Database__ApplyMigrationsOnStartup: "true"

volumes:
  postgres-data:
