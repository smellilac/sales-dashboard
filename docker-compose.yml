# Compose project name is fixed so it does not depend on the clone folder name (REPO).
name: sales-dashboard

services:
  postgres:
    image: postgres:17
    environment:
      # Password is inline: this compose file is for LOCAL runs only. Do not reuse in production.
      POSTGRES_USER: sales
      POSTGRES_PASSWORD: sales
      POSTGRES_DB: sales
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sales -d sales"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__Sales: "Host=postgres;Port=5432;Database=sales;Username=sales;Password=sales"
      Database__ApplyMigrationsOnStartup: "true"
    healthcheck:
      # curl is installed in the runtime image (see backend/Dockerfile). Readiness = DB reachable.
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      # Generous: the API applies migrations and seeds on first start (DB-INIT).
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  postgres-data:
